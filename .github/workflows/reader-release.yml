name: Reader release

on:
  pull_request:
  push:
    branches: [main, integration/spec-98]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reader-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  postgres-sessions:
    name: PostgreSQL session authority
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: '0.11.14'
      - name: Install PostgreSQL binaries and locked dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql libpq-dev
          uv sync --frozen --extra postgres
      - name: Verify actual session requests, schema provisioning, and restricted role
        run: uv run --extra postgres python scripts/try_postgres_reader.py --postgres-bin "$(pg_config --bindir)"
      - name: Verify configuration and offline benchmark controls
        run: uv run --extra postgres pytest -q tests/test_reader_session_config.py tests/test_reader_benchmark_control.py
      - name: Check deployment code
        run: |
          uv run --extra postgres ruff check src/cookbook/session_database.py src/cookbook/hosted.py scripts/local_session_postgres.py scripts/try_postgres_reader.py tests/test_session_database.py tests/test_reader_session_config.py
          uv run --extra postgres ruff format --check src/cookbook/session_database.py src/cookbook/hosted.py scripts/local_session_postgres.py scripts/try_postgres_reader.py tests/test_session_database.py tests/test_reader_session_config.py
      - name: Build native Linux deployment image with source-free search smoke check
        run: docker build --platform linux/amd64 -t cookbook-postgres-ci .
  serving:
    name: Linux serving and reader journeys
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.11.14'
      - name: Install locked dependencies
        run: uv sync --frozen
      # Deliberately explicit: discovery can invoke ingestion/OCR, which requires
      # the separate Linux VM/cgroup admission workflow. These tests serve only
      # synthetic fixtures; rendering enforcement uses synthetic decoders.
      - name: Verify assembled reader and Linux serving limits
        run: python scripts/verify_reader_release.py
      - name: Verify loopback preview boundary
        run: uv run pytest -q tests/test_reader_preview.py
      - name: Check reader code
        run: |
          uv run ruff check src/cookbook/reader*.py src/cookbook/owner_reports.py src/cookbook/owner_report_config.py src/cookbook/personal_config.py src/cookbook/storage.py src/cookbook/book_search.py scripts/preview_reader.py scripts/vendor_book_readers.py scripts/verify_reader_release.py tests/test_reader*.py tests/test_storage_conditions.py tests/test_search_process.py tests/reader_release_fixture.py
          uv run ruff format --check src/cookbook/reader*.py src/cookbook/owner_reports.py src/cookbook/owner_report_config.py src/cookbook/personal_config.py src/cookbook/storage.py src/cookbook/book_search.py scripts/preview_reader.py scripts/vendor_book_readers.py scripts/verify_reader_release.py tests/test_reader*.py tests/test_storage_conditions.py tests/test_search_process.py tests/reader_release_fixture.py
          git diff --check
