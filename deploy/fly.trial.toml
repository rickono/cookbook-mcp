# Review artifact only. No deployment has been performed with this configuration.
# Final cutover must target existing Machine 2863795a042368 / volume vol_r1jynq126n59expr.
app = "cookbook-agent"
primary_region = "sjc"
kill_signal = "SIGTERM"
kill_timeout = 30

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"
  COOKBOOK_RUNTIME = "/data/cookbook-mcp"
  COOKBOOK_ISSUER = "https://dev-ht1if5o1jgecqg10.us.auth0.com/"
  COOKBOOK_AUDIENCE = "https://cookbook-agent.fly.dev"
  COOKBOOK_JWKS_URL = "https://dev-ht1if5o1jgecqg10.us.auth0.com/.well-known/jwks.json"
  S3_ENDPOINT_URL = "https://a9d55860ca591e7132fa7274e86b3739.us.r2.cloudflarestorage.com"
  S3_BUCKET = "cookbook-library"
  AWS_DEFAULT_REGION = "auto"

[[mounts]]
  source = "cookbook_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  method = "GET"
  path = "/healthz"
  interval = "30s"
  timeout = "5s"
  # Fly caps routing-check grace at 1m; the application watchdog retains its 5m grace.
  grace_period = "1m"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "1gb"

[[restart]]
  policy = "always"
