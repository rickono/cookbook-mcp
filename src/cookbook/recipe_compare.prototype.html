);font-weight:600}.chapter span{font-size:11px;color:var(--muted)}.document-controls{display:flex;justify-content:space-between;align-items:center;margin:23px 0 0;padding:12px 0;border-top:1px solid var(--line);font-size:11px}.jump{display:flex;gap:16px;font-size:11px}.compact-part{border-top:1px solid var(--line);padding:13px 0}.compact-part a{font-size:13px;font-weight:550}.compact-part p{font-size:11px;color:var(--muted);margin:2px 0 0}.dish-step{display:grid;grid-template-columns:28px minmax(0,1fr);gap:7px;padding:21px 0;border-top:1px solid var(--line)}.dish-number{font-family:Georgia,serif;font-size:24px;color:#98a28b;line-height:1.2}.dish-step h2{font-size:18px;margin-bottom:9px}.dish-step p{font-size:13px;line-height:1.8;color:#606b58;margin:0 0 10px}.recipe-links{list-style:none;padding:0;margin:0}.recipe-links li{padding:7px 0;display:flex;justify-content:space-between;gap:18px;font-size:12px;border-bottom:1px solid #eef0e9}.recipe-links li:last-child{border:0}.recipe-links span{font-size:10px;color:var(--muted);text-align:right;max-width:45%}.recipe-links a{font-weight:550}.return-bar{position:sticky;top:0;background:#fffefb;border-bottom:1px solid var(--line);padding:11px 0;margin-bottom:24px;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:16px}.return-bar button{font-size:12px;border:0;padding:4px 0;color:var(--green);max-width:90%;text-align:left}.return-bar span{font-size:10px;color:var(--muted)}.workspace{display:grid;grid-template-columns:160px minmax(0,1fr);gap:26px;border-top:1px solid var(--line);padding-top:20px}.workspace aside{align-self:start;position:sticky;top:15px}.workspace nav p{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin:18px 0 7px}.workspace nav p:first-child{margin-top:0}.workspace nav button{display:block;width:100%;text-align:left;font-size:11px;border:0;padding:6px 9px;border-radius:4px;line-height:1.6;margin:1px 0;color:#65715b}.workspace nav button[aria-current </style></head><body><main>
<div class="prototype-tools"><label>Example <select id="sample"><option value="simple">Mushrooms & beans</option><option value="emp" disabled>Eleven Madison Park</option></select></label><span>Browser prototype · stateless</span></div>
<p class="user" id="user"></p><p class="reply" id="reply"></p><div id="view"></div>
</main><nav class="switcher" aria-label="Compare prototypes" hidden><button id="prev" aria-label="Previous prototype">←</button><div class="switch-label"><small>Recipe composition study</small><strong id="variant-name"></strong></div><button id="next" aria-label="Next prototype">→</button></nav>
<script>
const simple={id:'simple',title:'Miso mushrooms & butter beans',subtitle:'A comforting pan for a weeknight',book:'Original prototype recipe',authors:'Illustrative sample',serves:2,meta:'10 min prep · 20 min cook · Vegetarian',description:'Golden mushrooms and creamy beans, brightened with lemon.',provenance:'Original synthetic recipe. Prep tasks have been pulled out of the ingredient descriptions and arranged as a sample AI prep plan.',notice:'Original sample quantities for 2 servings. Timings are illustrative.',equipment:'Suggested equipment: wide frying pan, cutting board, knife, small bowl, grater and measuring spoons.',plan:[{title:'Before the pan goes on',text:'Tear the mushrooms, slice the garlic, drain the beans and prepare the finishing ingredients.',ids:['main']},{title:'Cook in one pan',text:'Brown the mushrooms, make the sauce and warm the beans. Add lemon and herbs at the end.',ids:['main']}],components:[{id:'main',title:'Mushrooms & butter beans',yield:'Serves 2',needed:'The complete dish',page:null,depends:[],ingredients:['300 g mixed mushrooms, torn','1 tbsp olive oil','2 garlic cloves, sliced','1 tbsp white miso','400 g canned butter beans, drained','150 ml water','1 tbsp butter','½ lemon, juice and zest','2 tbsp chopped parsley','2 slices sourdough toast, to serve'],prep:[{text:'Tear the mushrooms into pieces.',evidence:'300 g mixed mushrooms, torn.'},{text:'Slice the garlic; keep it separate from the mushrooms.',evidence:'2 garlic cloves, sliced. Garlic is added after the mushrooms brown.'},{text:'Drain the butter beans.',evidence:'400 g canned butter beans, drained.'},{text:'Zest and juice the lemon; chop the parsley. Keep both for finishing.',evidence:'½ lemon, juice and zest; 2 tbsp chopped parsley.'},{text:'Measure the miso and water into a small bowl, ready to mix.',evidence:'Mix the miso with the water in a small bowl.'}],steps:[{title:'Brown the mushrooms',body:'Heat the olive oil in a wide pan over medium-high heat. Add the mushrooms in a single layer. Leave until golden underneath, then turn and cook until browned.',uses:[0,1]},{title:'Make the sauce',body:'Lower the heat to medium. Add the sliced garlic and stir until fragrant. Mix the miso with the water, pour it into the pan, and scrape up the browned bits.',uses:[2,3,5]},{title:'Warm the beans',body:'Fold in the drained beans. Simmer gently until the sauce lightly coats them, stirring occasionally. Add a splash of water if it looks dry.',uses:[4]},{title:'Finish and serve',body:'Take the pan off the heat. Stir in butter, lemon zest and a squeeze of lemon juice. Taste, add more lemon if you like, and scatter over the parsley. Serve with toast.',uses:[6,7,8,9]}]}]};
const params=new URLSearchParams(location.search),labels={A:'The complete recipe',B:'A dish of recipes',C:'The prep plan'},recipes={simple};
const state={recipe:'simple',variant:labels[params.get('variant')]?params.get('variant'):'B',reading:null,selected:'lemon',compact:false};
const requested=params.get('recipe'),stack=[];
const groups=[{title:'Start ahead',ids:['lemon','stock','pickles','crumble']},{title:'Prepare the components',ids:['vinaigrette','cumin','puree','date','duck','oven','grains','sauce']},{title:'Finish & plate',ids:['plate']}];
const r=()=>recipes[state.recipe],c=id=>r().components.find(p=>p.id===id),order=()=>state.recipe==='simple'?['main']:groups.flatMap(g=>g.ids);
const esc=v=>String(v??'').replace(/[&<>"']/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
const norm=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
function link(id,label){return `<a href="#${esc(id)}" data-recipe="${esc(id)}">${esc(label||c(id).title)}</a>`}
function ingredient(text,id){const dep=r().components.find(p=>p.id!==id&&norm(text).includes(norm(p.title)));return dep?link(dep.id,text):esc(text)}
function heading(){return `<header class="head"><p class="eyebrow">${state.recipe==='emp'?'Eleven Madison Park':'Original sample recipe'}</p><h1>${esc(r().title)}</h1>${state.recipe==='emp'?`<p class="subtitle">${esc(r().subtitle)}</p>`:''}<p class="meta">Serves ${r().serves} · ${state.recipe==='emp'?'Begin the day before · Daniel Humm & Will Guidara':'30 minutes · Vegetarian'}</p><p class="intro">${state.recipe==='emp'?'Two carrot preparations, dressed wheat berries, purées and a warm carrot sauce. Finished with pickled dates and a crisp crumble.':esc(r().description)}</p></header>`}
function advance(){return state.recipe==='emp'?`<div class="advance"><p><b>Start ahead.</b> ${link('lemon')} rests overnight. ${link('stock')}, ${link('pickles')} and ${link('crumble')} also need a head start.</p><p>The carrot preparations and crumble use different oven temperatures; allow separate batches with one oven.</p></div>`:''}
function quantities(p){return `<div class="measure"><div><span>Needed here</span>${esc(p.needed)}</div><div><span>Source batch</span>${esc(p.yield)}</div></div>`}
function mise(p,open=false){return p.prep.length?`<details class="mise" ${open?'open':''}><summary>Mise en place</summary><ul>${p.prep.map(x=>`<li>${esc(x.text)}</li>`).join('')}</ul><p>Prep organized from the ingredient list and method.</p></details>`:''}
function ingredients(p){return `<p class="ingredient-label">${state.recipe==='emp'?'Ingredients · source batch':'Ingredients'}</p><ul class="ingredients">${p.ingredients.map(x=>`<li>${ingredient(x,p.id)}</li>`).join('')}</ul>`}
function dependencies(p){return p.depends.length?`<p class="dependencies"><b>Have ready:</b> ${p.depends.map(id=>link(id)).join(' · ')}</p>`:''}
function method(p){const allocated=p.steps.every(s=>s.uses);return `${allocated?'':ingredients(p)}<ol class="steps">${p.steps.map(s=>`<li><h3>${esc(s.title)}</h3><p>${esc(s.body)}</p>${s.uses?`<div class="step-ingredients">${state.recipe==='emp'?'<span class="tiny">Source batch · </span>':''}${s.uses.map(i=>ingredient(p.ingredients[i],p.id)).join(' · ')}</div>`:''}</li>`).join('')}</ol>`}
function partBody(p,{yieldInfo=true,prepOpen=false}={}){return `${yieldInfo&&state.recipe==='emp'?quantities(p):''}${dependencies(p)}${mise(p,prepOpen)}${method(p)}<p class="tiny"><button class="link-button" data-source="${p.id}">${p.page?'Source p. '+p.page:'About this sample'}</button></p>`}
function foot(){return `<p class="foot">${state.recipe==='emp'?'Arrangement and prep suggestions for this prototype; source methods condensed. Original batch quantities retained.':'Original illustrative recipe; timings are approximate.'} <button class="link-button" data-source="main">${state.recipe==='emp'?'Read the source':'About this sample'}</button></p>`}
function simpleRecipe(){return `<article class="recipe">${heading()}${mise(c('main'),true)}${method(c('main'))}${foot()}</article>`}
function VariantA(){if(state.recipe==='simple')return simpleRecipe();return `<article class="recipe">${heading()}${advance()}<div class="document-controls"><div class="jump"><a href="#chapter-0">Start ahead</a><a href="#chapter-1">Components</a><a href="#chapter-2">Plate</a></div><button data-compact class="link-button" aria-expanded="${!state.compact}">${state.compact?'Expand method':'Compact method'}</button></div>${groups.map((g,i)=>`<div class="chapter" id="chapter-${i}"><p class="eyebrow">${esc(g.title)}</p><span>${i===0?'Begin with these preparations':i===1?'Prerequisites appear before use':'Bring everything together'}</span></div>${g.ids.map(id=>{const p=c(id);return state.compact?`<div class="compact-part">${link(id)}<p>${esc(p.needed)}</p></div>`:`<section class="part" id="part-${id}"><h2>${esc(p.title)}</h2>${partBody(p)}</section>`}).join('')}`).join('')}${foot()}</article>`}
function recipeLinks(ids){return `<ul class="recipe-links">${ids.map(id=>`<li>${link(id)}<span>${esc(c(id).needed)}</span></li>`).join('')}</ul>`}
function dishStep(n,title,body){return `<section class="dish-step"><div class="dish-number">${n}</div><div><h2>${title}</h2>${body}</div></section>`}
function VariantB(){if(state.recipe==='simple')return simpleRecipe();return `<article class="recipe">${heading()}${advance()}${dishStep(1,'Prepare the foundations',`<p>Start the lemon oil first. Make the stock, pickled dates and crumble, then the vinaigrette, cumin oil and two purées. Some batches make more than this dish needs; the amounts below show what you’ll use.</p>${recipeLinks(['lemon','stock','pickles','crumble','vinaigrette','cumin','puree','date'])}`)}${dishStep(2,'Cook the carrots and wheat berries',`<p>The grains use the stock and lemon vinaigrette. Both carrot preparations are needed for each plate.</p>${recipeLinks(['duck','oven','grains'])}`)}${dishStep(3,'Make the carrot sauce',`<p>Reduce the carrot juice, then blend the sauce with the prepared cumin oil.</p>${recipeLinks(['sauce'])}`)}${dishStep(4,'Bring everything together',`${mise(c('plate'))}${method(c('plate'))}`)}${foot()}</article>`}
function planNav(){return groups.map(g=>`<p>${esc(g.title)}</p>${g.ids.map(id=>`<button data-select="${id}" aria-current="${state.selected===id}">${esc(c(id).title)}</button>`).join('')}`).join('')}
function VariantC(){if(state.recipe==='simple')return simpleRecipe();const p=c(state.selected);return `<article class="recipe">${heading()}${advance()}<div class="workspace"><aside><nav aria-label="Preparations">${planNav()}</nav></aside><div><label class="mobile-nav">Read a preparation<select id="preparation">${groups.map(g=>`<optgroup label="${esc(g.title)}">${g.ids.map(id=>`<option value="${id}" ${id===p.id?'selected':''}>${esc(c(id).title)}</option>`).join('')}</optgroup>`).join('')}</select></label><section id="selected-preparation" tabindex="-1"><p class="eyebrow">${esc(groups.find(g=>g.ids.includes(p.id)).title)}</p><h2>${esc(p.title)}</h2>${partBody(p,{prepOpen:true})}<div class="read-next"><span>${order().indexOf(p.id)+1} of ${order().length} sections</span>${order().indexOf(p.id)<order().length-1?`<button class="link-button" data-select="${order()[order().indexOf(p.id)+1]}">Next preparation →</button>`:''}</div></section></div></div>${foot()}</article>`}
function source(id){if(state.recipe==='simple')return '<h2>About this sample</h2><p>An original illustrative recipe made for this prototype, with fixed sample timings and quantities.</p>';let data=['main','oven','duck','grains','sauce','plate'].includes(id)?r().sources.main:r().sources[id];if(id==='pickles')data={...data,text:data.text+'\n'+r().sources.pickles_end.text};return `<p class="eyebrow">Original source</p><h2>${esc(c(id)?.title||r().title)}</h2><p class="meta">${esc(r().book)} · p. ${c(id)?.page||191}</p><div class="source-text">${esc(data.text)}</div>`}
function reader(){const top=stack[stack.length-1],back=top?.reading?(top.reading.startsWith('source:')?'source':c(top.reading)?.title):'dish';return `<article class="recipe"><div class="return-bar"><button data-back>← Back to ${esc(back)}</button><span>${state.reading.startsWith('source:')?'Source':'Preparation'}</span></div>${state.reading.startsWith('source:')?source(state.reading.slice(7)):`<p class="eyebrow">${esc(r().book)}</p><h2 tabindex="-1" id="reader-title">${esc(c(state.reading).title)}</h2>${partBody(c(state.reading),{prepOpen:true})}`}</article>`}
function log(){console.info('Recipe composition prototype',JSON.stringify({...state,backStack:stack.map(x=>x.reading)}))}
function updateURL(){const u=new URL(location.href);u.searchParams.set('variant',state.variant);u.searchParams.set('recipe',state.recipe);history.replaceState(null,'',u)}
function render(){document.getElementById('sample').value=state.recipe;document.getElementById('user').textContent=state.recipe==='emp'?'Show me an ambitious recipe from Eleven Madison Park.':'Something comforting with mushrooms and beans for two?';document.getElementById('reply').textContent=state.recipe==='emp'?'This dish brings together several preparations. Here’s how they fit.':'Try these mushrooms and butter beans with toast.';document.getElementById('view').innerHTML=state.reading?reader():({A:VariantA,B:VariantB,C:VariantC}[state.variant])();document.getElementById('variant-name').textContent=state.variant+' — '+labels[state.variant];const select=document.getElementById('preparation');if(select)select.onchange=e=>selectPreparation(e.target.value);log()}
function openRecipe(id,trigger){stack.push({reading:state.reading,scroll:window.scrollY,html:document.getElementById('view').innerHTML,focusKey:trigger?.dataset.source?'source': 'recipe',focusValue:trigger?.dataset.source||trigger?.dataset.recipe});state.reading=id;render();document.getElementById('view').scrollIntoView({block:'start'});document.getElementById('reader-title')?.focus({preventScroll:true})}
function back(){const prior=stack.pop();if(!prior)return;state.reading=prior.reading;document.getElementById('view').innerHTML=prior.html;const select=document.getElementById('preparation');if(select)select.onchange=e=>selectPreparation(e.target.value);const targets=[...document.querySelectorAll(`[data-${prior.focusKey}]`)];targets.find(el=>el.dataset[prior.focusKey]===prior.focusValue)?.focus({preventScroll:true});window.scrollTo(0,prior.scroll);log()}
function selectPreparation(id){state.selected=id;render();document.getElementById('selected-preparation').scrollIntoView({block:'start'});document.getElementById('selected-preparation').focus({preventScroll:true})}
function switchVariant(n){const ids=Object.keys(labels);state.variant=ids[(ids.indexOf(state.variant)+n+ids.length)%ids.length];state.reading=null;stack.length=0;updateURL();render();window.scrollTo(0,0)}
document.getElementById('sample').onchange=e=>{state.recipe=e.target.value;state.reading=null;stack.length=0;state.compact=false;updateURL();render();window.scrollTo(0,0)};
document.getElementById('prev').onclick=()=>switchVariant(-1);document.getElementById('next').onclick=()=>switchVariant(1);
document.addEventListener('click',e=>{const t=e.target.closest('[data-recipe],[data-source],[data-back],[data-select],[data-compact]');if(!t)return;e.preventDefault();if(t.hasAttribute('data-back'))back();else if(t.dataset.source)openRecipe('source:'+t.dataset.source,t);else if(t.dataset.select)selectPreparation(t.dataset.select);else if(t.hasAttribute('data-compact')){const y=window.scrollY;state.compact=!state.compact;render();document.querySelector('[data-compact]')?.focus({preventScroll:true});window.scrollTo(0,y)}else if(state.variant==='A'&&!state.reading&&!state.compact){document.getElementById('part-'+t.dataset.recipe)?.scrollIntoView({block:'start'})}else openRecipe(t.dataset.recipe,t)});
const switcher=document.querySelector('.switcher');switcher.hidden=!['localhost','127.0.0.1',''].includes(location.hostname);document.addEventListener('keydown',e=>{if(e.key==='Escape'&&state.reading){back();return}if(state.reading||switcher.hidden||e.target.closest('input,select,textarea,[contenteditable]'))return;if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();switchVariant(e.key==='ArrowLeft'?-1:1)}});
render();fetch('/emp.prototype.json').then(x=>{if(!x.ok)throw Error('missing');return x.json()}).then(x=>{const allocations={oven:[[0,1,2]],duck:[[0,1],[2,3,4,5,6]],grains:[[0,1,2,3,4,5,6],[7,8]],sauce:[[0],[1,2,3,4,5]],plate:[[0,1],[2,3,4],[5,6,7,8]]};for(const p of x.components)if(allocations[p.id])p.steps.forEach((s,i)=>s.uses=allocations[p.id][i]);recipes.emp=x;document.querySelector('#sample option[value="emp"]').disabled=false;if(requested==='emp'){state.recipe='emp';render()}}).catch(()=>{document.querySelector('#sample option[value="emp"]').textContent='EMP sample unavailable'});
</script></body></html>
