</style></head><body><div id="root"></div><script>
const simple={id:'simple',title:'Miso mushrooms & butter beans',subtitle:'A comforting pan for a weeknight',book:'Original prototype recipe',authors:'Illustrative sample',serves:2,meta:'10 min prep · 20 min cook · Vegetarian',description:'Golden mushrooms and creamy beans, brightened with lemon.',provenance:'Original synthetic recipe. Prep tasks have been pulled out of the ingredient descriptions and arranged as a sample AI prep plan.',notice:'Original sample quantities for 2 servings. Timings are illustrative.',equipment:'Suggested equipment: wide frying pan, cutting board, knife, small bowl, grater and measuring spoons.',plan:[{title:'Before the pan goes on',text:'Tear the mushrooms, slice the garlic, drain the beans and prepare the finishing ingredients.',ids:['main']},{title:'Cook in one pan',text:'Brown the mushrooms, make the sauce and warm the beans. Add lemon and herbs at the end.',ids:['main']}],components:[{id:'main',title:'Mushrooms & butter beans',yield:'Serves 2',needed:'The complete dish',page:null,depends:[],ingredients:['300 g mixed mushrooms, torn','1 tbsp olive oil','2 garlic cloves, sliced','1 tbsp white miso','400 g canned butter beans, drained','150 ml water','1 tbsp butter','½ lemon, juice and zest','2 tbsp chopped parsley','2 slices sourdough toast, to serve'],prep:[{text:'Tear the mushrooms into pieces.',evidence:'300 g mixed mushrooms, torn.'},{text:'Slice the garlic; keep it separate from the mushrooms.',evidence:'2 garlic cloves, sliced. Garlic is added after the mushrooms brown.'},{text:'Drain the butter beans.',evidence:'400 g canned butter beans, drained.'},{text:'Zest and juice the lemon; chop the parsley. Keep both for finishing.',evidence:'½ lemon, juice and zest; 2 tbsp chopped parsley.'},{text:'Measure the miso and water into a small bowl, ready to mix.',evidence:'Mix the miso with the water in a small bowl.'}],steps:[{title:'Brown the mushrooms',body:'Heat the olive oil in a wide pan over medium-high heat. Add the mushrooms in a single layer. Leave until golden underneath, then turn and cook until browned.',uses:[0,1]},{title:'Make the sauce',body:'Lower the heat to medium. Add the sliced garlic and stir until fragrant. Mix the miso with the water, pour it into the pan, and scrape up the browned bits.',uses:[2,3,5]},{title:'Warm the beans',body:'Fold in the drained beans. Simmer gently until the sauce lightly coats them, stirring occasionally. Add a splash of water if it looks dry.',uses:[4]},{title:'Finish and serve',body:'Take the pan off the heat. Stir in butter, lemon zest and a squeeze of lemon juice. Taste, add more lemon if you like, and scatter over the parsley. Serve with toast.',uses:[6,7,8,9]}]}]};
const q=new URLSearchParams(location.search),variant='B';let expanded=q.get('expanded')!=='false',sourceOpen=false;
const p=simple.components[0],esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const brief=[
'Heat the olive oil in a wide pan over medium-high heat. Brown the mushrooms in a single layer, turning once golden underneath.',
'Lower the heat. Stir in the garlic until fragrant. Mix miso with water, pour into the pan and scrape up the browned bits.',
'Fold in the beans and simmer until lightly coated. Add a splash of water if the sauce looks dry.',

const stages=[

const parallel=[
 {title:'Start the mushrooms',uses:[0,1],body:'Tear the mushrooms. Heat the oil over medium-high heat, then add mushrooms in a single layer.',wait:'While they brown',prep:'Slice the garlic; mix miso with water. Turn the mushrooms when golden underneath.',next:'Ready for the sauce',prepUses:[2,3,5]},

 {title:'Finish off the heat',uses:[6,7,8,9],body:'Once the beans are warm and the finishing ingredients are ready, remove from heat. Stir in butter and lemon to taste. Add parsley; serve with toast.'}

function ingredients(cols=false){return `<ul class="ingredient-list ${cols?'two-columns':''}">${p.ingredients.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`}
function mise(){return `<details class="mise"><summary>Mise en place <span>· optional prep guide</span></summary><ul>${p.prep.map(x=>`<li>${esc(x.text)}</li>`).join('')}</ul></details>`}
function method(){return `<ol class="method">${p.steps.map((s,i)=>`<li><h3>${esc(s.title)}</h3><p>${esc(brief[i])}</p></li>`).join('')}</ol>`}
function VariantA(){return `<div class="grid"><aside><h2>Ingredients</h2>${ingredients()}</aside><section><h2>Method</h2>${method()}</section></div>${mise()}`}

function VariantB(){return `<section class="aligned"><div class="aligned-head"><h2>Ingredients for this action</h2><h2>Method</h2></div>${stages.map((step,i)=>`<section class="action-row"><aside>${groupIngredients(step.uses)}</aside><div><h3><span class="step-num">${i+1}</span>${esc(step.title)}</h3><p>${esc(step.body)}</p></div></section>`).join('')}</section>`}
function VariantC(){return `<div class="parallel-grid"><aside class="pantry"><h2>Ingredients</h2>${stages.map((step,i)=>`<section class="pantry-group"><h3>${['Start','Sauce','Beans','Finish'][i]}</h3>${groupIngredients(step.uses)}</section>`).join('')}</aside><section><h2>Cook & prepare</h2><ol class="method">${parallel.map((step,i)=>`<li><h3>${esc(step.title)}</h3><p>${esc(step.body)}</p>${step.prep?`<div class="overlap ${step.wait.startsWith('While')?'':'before'}"><h4>${esc(step.wait)}</h4><p>${esc(step.prep)}</p><span class="next-use">${esc(step.next)}</span></div>`:''}</li>`).join('')}</ol></section></div>`}
function render(){document.getElementById('root').innerHTML=`<article class="${expanded?'':'collapsed'}"><header class="card-head"><h1>${esc(simple.title)}</h1><p class="meta">30 minutes · Serves 2 · Vegetarian</p>${!expanded?`<p class="description">${esc(simple.description)}</p>`:''}</header><div id="recipe-body">${expanded?({A:VariantA,B:VariantB,C:VariantC}[variant])():'<p class="collapsed-meta">10 ingredients · 4 steps</p>'}</div><footer class="footer"><button class="source" id="source" aria-expanded="${sourceOpen}" aria-controls="source-note">Original sample · About</button><button id="expand" class="toggle" aria-expanded="${expanded}" aria-controls="recipe-body">${expanded?'Compact recipe':'View recipe'} <span aria-hidden="true">${expanded?'↑':'↓'}</span></button></footer><p id="source-note" class="source-note" ${sourceOpen?'':'hidden'}>Original illustrative recipe for this design prototype. Quantities and timings are fixed examples. Prep instructions are authored for this sample.</p></article>`;document.getElementById('expand').onclick=()=>{expanded=!expanded;render();document.getElementById('expand').focus({preventScroll:true});log()};document.getElementById('source').onclick=()=>{sourceOpen=!sourceOpen;document.getElementById('source-note').hidden=!sourceOpen;document.getElementById('source').setAttribute('aria-expanded',String(sourceOpen));log()};document.querySelectorAll('details').forEach(el=>el.addEventListener('toggle',log));resize();}
function log(){const state={variant,expanded,sourceOpen,disclosures:[...document.querySelectorAll('details')].map(d=>({title:d.querySelector('summary').textContent,open:d.open}))};console.info('Everyday recipe prototype',state);parent.postMessage({type:'recipe-prototype:state',state},'*')}
let lastHeight=0;function resize(){const height=Math.ceil(document.body.getBoundingClientRect().height);if(height!==lastHeight){lastHeight=height;parent.postMessage({type:'recipe-prototype:size',height},'*')}}

render();log();new ResizeObserver(resize).observe(document.body);
</script></body></html>
