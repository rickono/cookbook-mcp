<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Everyday recipe · HTML study</title><style>
:root{font:14px/1.6 system-ui,-apple-system,sans-serif;--bg:#fff;--fg:#252525;--muted:#757575;--line:#e3e3e3;--soft:#f3f3f3}html[data-theme=dark]{color-scheme:dark;--bg:#212121;--fg:#eee;--muted:#aaa;--line:#414141;--soft:#303030}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg)}button,select{font:inherit;color:inherit}button,select{cursor:pointer;border:1px solid var(--line);background:var(--bg);border-radius:5px;padding:5px 9px}button:focus-visible,select:focus-visible{outline:2px solid currentColor;outline-offset:3px}.tools{max-width:800px;margin:20px auto 28px;padding:0 20px;display:flex;justify-content:space-between;align-items:center;gap:14px;font-size:11px;color:var(--muted)}.tools label{display:flex;align-items:center;gap:7px}.tools select{font-size:11px}.controls{display:flex;gap:12px}.conversation{width:min(100% - 32px,640px);margin:0 auto 110px}.conversation.phone{width:min(100% - 24px,358px)}.user{margin:0 0 28px auto;max-width:310px;background:var(--soft);border-radius:16px 16px 3px 16px;padding:10px 15px;font-size:13px}.tool-name{font-size:11px;color:var(--muted);margin:0 0 8px;display:flex;gap:6px;align-items:center}.tool-name svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.4}.frame-wrap{border:1px solid var(--line);border-radius:12px;overflow:hidden}iframe{border:0;display:block;width:100%;height:480px;background:var(--bg)}.following{font-size:13px;margin:19px 0 0}.measure{font-size:10px;color:var(--muted);margin:12px 0 0}[hidden]{display:none!important}@media(max-width:470px){.tools{align-items:flex-start;padding:0 14px}.tools>span{max-width:100px}.controls{gap:6px}.controls label{display:block}.controls select{max-width:110px}}
</style></head><body><div class="tools"><span>Everyday recipe preview · simulated chat</span><div class="controls"><label>Width <select id="width"><option value="chat">Chat</option><option value="phone">Phone</option></select></label><label>Theme <select id="theme"><option value="light">Light</option><option value="dark">Dark</option></select></label></div></div><main class="conversation" id="conversation"><p class="user">Something comforting with mushrooms and beans for two?</p><p class="tool-name"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 2h5l1 1 1-1h5v11H9l-1 1-1-1H2zm6 1v11"/></svg>Cookbook</p><div class="frame-wrap"><iframe id="card" title="Everyday recipe card" sandbox="allow-scripts"></iframe></div><p class="following">You can ask for a shopping list or a substitution.</p><p class="measure" id="measure">Measuring card…</p></main><script>
const variant='B';const card=document.getElementById('card');let cardHeight=0;
function theme(){const value=document.getElementById('theme').value;document.documentElement.dataset.theme=value;card.contentWindow.postMessage({type:'recipe-prototype:theme',theme:value},'*')}
function render(){const u=new URL(location.href);u.searchParams.set('variant',variant);history.replaceState(null,'',u);card.src='/everyday-recipe-widget.prototype?variant='+variant+'&expanded=true';console.info('Everyday recipe study',{variant,width:document.getElementById('width').value,theme:document.getElementById('theme').value})}
function measure(){document.getElementById('measure').textContent=`Card: ${Math.round(card.getBoundingClientRect().width)} × ${cardHeight} px · auto height, no internal scrolling`}
window.addEventListener('message',e=>{if(e.source!==card.contentWindow)return;if(e.data?.type==='recipe-prototype:size'&&Number.isFinite(e.data.height)&&e.data.height>0&&e.data.height<10000){cardHeight=e.data.height;card.style.height=cardHeight+'px';measure()}if(e.data?.type==='recipe-prototype:state')console.info('Recipe view state',e.data.state)});
new ResizeObserver(measure).observe(card);card.onload=theme;document.getElementById('theme').onchange=theme;document.getElementById('width').onchange=e=>{document.getElementById('conversation').classList.toggle('phone',e.target.value==='phone');measure()};render();
</script></body></html>
