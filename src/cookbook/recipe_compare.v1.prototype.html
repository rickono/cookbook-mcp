<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Recipe layout comparison</title>
<style>
:root{font:14px/1.65 system-ui,-apple-system,sans-serif;color:#30332d;background:white;--ink:#30332d;--muted:#7b8174;--line:#e3e6dd;--accent:#44613e;--pale:#f6f7f2}*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0}button,select{font:inherit;color:inherit}button,a,summary{cursor:pointer}button{background:white;border:1px solid var(--line);border-radius:6px;padding:7px 12px}button:hover{background:var(--pale)}button:focus-visible,a:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid #5f7f55;outline-offset:3px}a{color:var(--accent);text-underline-offset:3px;text-decoration-color:#bbc8b1}.primary{background:var(--accent);color:white;border-color:var(--accent)}.primary:hover{background:#354e30}.quiet{border:0;padding:0;background:transparent;color:var(--muted);font-size:11px}.quiet:hover{background:transparent;color:var(--accent)}main{max-width:930px;padding:25px 28px 120px;margin:auto}.sample-control{display:flex;align-items:center;gap:9px;color:var(--muted);font-size:11px;margin-bottom:29px}.sample-control select{font-size:11px;padding:4px 8px;border:1px solid var(--line);border-radius:5px;background:white}.user{font-size:13px;background:#f2f3ef;max-width:345px;margin:0 0 24px auto;padding:11px 17px;border-radius:17px 17px 3px 17px}.reply{font-size:13px;margin:0 0 24px}.eyebrow{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}h1{font-size:30px;line-height:1.2;letter-spacing:-.03em;margin:8px 0 10px;font-weight:560}h2{font-size:19px;font-weight:560;line-height:1.35;letter-spacing:-.02em}h3{font-size:14px;font-weight:650}.meta{font-size:12px;color:#737b6a;margin:0 0 8px}.byline{font-size:11px;color:var(--muted);margin:0}.plan-note{font-size:12px;color:#6c765f;line-height:1.7;margin:18px 0 0}.recipe-heading{margin-bottom:25px}.ingredients{list-style:none;padding:0;margin:0}.ingredients li{font-size:13px;line-height:1.6;padding:4px 0}.method{padding-left:20px;margin:0}.method li{padding-left:6px;margin:0 0 18px;font-size:14px;line-height:1.8}.method li::marker{color:var(--accent);font-size:12px}.method strong{font-weight:600;display:block;margin-bottom:4px}.prep{font-size:12px;line-height:1.7;color:#69745f;background:var(--pale);padding:13px 16px;margin:0 0 20px}.prep strong{color:#485340;font-weight:600}.prep p{margin:5px 0 0}.source-row{margin:15px 0 0;font-size:11px;color:var(--muted)}.support-block{border-top:1px solid var(--line);margin-top:30px;padding-top:15px;font-size:12px;color:var(--muted)}.support-block summary{padding:6px 0}.support-links{display:flex;flex-wrap:wrap;gap:7px 18px;margin:12px 0;font-size:12px}.footnote{font-size:10px;color:var(--muted);margin-top:25px}.book{border-top:2px solid #596f4d;padding:25px 0 0}.book h1{font-family:Georgia,serif;font-size:34px;letter-spacing:-.025em;font-weight:400}.book .book-section{margin:30px 0 0;padding:23px 0 0;border-top:1px solid var(--line)}.book .book-section.single{border:0;padding:0;margin-top:20px}.book .book-section>h2{font-family:Georgia,serif;font-size:23px;font-weight:400;margin:0 0 17px}.book-grid{display:grid;grid-template-columns:minmax(170px,.8fr) minmax(0,1.35fr);gap:30px}.book-grid h3{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:550;margin:0 0 12px}.book-grid .prep{margin-top:18px}.book .method strong{display:none}.book .method li{font-size:13px}.book .yield{font-size:10px;color:var(--muted);margin:0 0 12px}.flow{max-width:650px}.flow h1{font-size:28px;font-weight:650}.flow .recipe-heading{margin-bottom:28px}.flow-part{position:relative;padding-left:30px;border-left:1px solid #dce4d4;margin:0 0 33px 9px}.flow-part:before{content:'';position:absolute;left:-5px;top:7px;width:9px;height:9px;border-radius:50%;background:#91a980}.flow-part>h2{margin:0 0 15px;font-size:17px;font-weight:650}.flow-part .prep{background:transparent;padding:0;margin:0 0 18px;font-size:12px}.flow-step{margin:0 0 24px}.flow-step h3{font-size:15px;margin:0 0 7px;font-weight:600}.flow-step p{font-size:14px;line-height:1.85;margin:0}.at-hand{font-size:11px;background:#f4f6ef;color:#66765b;border-radius:5px;padding:10px 12px;margin:12px 0 0;line-height:1.8}.at-hand b{font-size:9px;text-transform:uppercase;letter-spacing:.06em;display:block;margin-bottom:3px;color:#839077;font-weight:550}.flow-part .whole-ingredients{font-size:11px;color:var(--muted);margin:0 0 20px}.whole-ingredients summary{font-size:12px;padding:5px 0;color:#617455}.whole-ingredients .ingredients{margin-top:8px}.outline{border:1px solid var(--line);border-radius:10px;max-width:650px;overflow:hidden}.outline .recipe-heading{padding:23px 24px 20px;margin:0}.outline h1{font-size:25px;font-weight:610;margin:5px 0 10px}.outline .plan-note{font-size:12px;background:#f6f7f1;padding:12px 24px;margin:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.outline-rows{padding:3px 24px}.outline-row{border:0;border-bottom:1px solid #ecefe6;border-radius:0;background:transparent;padding:15px 0;display:grid;grid-template-columns:1fr 15px;gap:8px;width:100%;text-align:left}.outline-row:last-child{border-bottom:0}.outline-row:hover{background:#fafbf7}.outline-row strong{display:block;font-size:13px;font-weight:570;margin:0 0 3px}.outline-row small{display:block;color:#808975;font-size:11px;font-weight:400}.outline-row .arrow{color:#9ba68e;align-self:center;font-size:15px}.outline-footer{border-top:1px solid var(--line);padding:14px 24px;font-size:11px;display:flex;justify-content:space-between;gap:15px}.outline-brief{padding:0 24px 24px}.outline-brief p{font-size:13px;margin:0 0 18px;color:#707b64}.reader{border:1px solid var(--line);border-radius:12px;padding:0;width:min(720px,calc(100% - 20px));max-height:90vh;color:inherit}.reader::backdrop{background:#27332455}.reader-top{position:sticky;top:0;padding:13px 22px;background:white;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:15px;z-index:2}.reader-top span{font-size:11px;color:var(--muted)}.reader-top button{border:0;font-size:23px;padding:0 7px}.reader-body{padding:25px 28px}.reader-body h2{font-size:26px;margin:0 0 8px}.reader-body h3{font-size:13px;margin:25px 0 12px}.reader-body .prep{margin-top:24px}.reader-body .source-text{font-size:13px;line-height:1.85;white-space:pre-wrap}.reader-body .yield{font-size:11px;color:var(--muted);margin-bottom:25px}.reader-body details{font-size:11px;margin-top:16px}.reader-body pre{white-space:pre-wrap;overflow-wrap:anywhere}.switcher{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);display:flex;align-items:center;justify-content:space-between;gap:17px;width:330px;max-width:calc(100% - 22px);background:#273027;color:white;border-radius:10px;padding:5px;box-shadow:0 3px 17px #0002;z-index:4}.switcher button{border:0;color:white;background:transparent;padding:3px 11px;font-size:22px}.switcher button:hover{background:#ffffff15}.switch-label{text-align:center;line-height:1.4}.switch-label small{display:block;font-size:8px;text-transform:uppercase;letter-spacing:.1em;color:#c1cbb9}.switch-label strong{font-size:12px;font-weight:450}
.flow-toolbar{display:flex;justify-content:flex-end;margin:-10px 0 24px}.flow-toggle{font-size:12px;color:var(--accent);padding:5px 11px}.flow-compact{border-top:1px solid var(--line);padding-top:15px}.flow-compact ol{padding-left:22px;margin:0}.flow-compact li{padding:3px 0 3px 4px;font-size:13px}.flow-compact li::marker{color:var(--muted);font-size:11px}.flow-compact .plan-note{margin:12px 0 0}.flow.is-compact .recipe-heading{margin-bottom:20px}
@media(max-width:520px){main{padding:20px 17px 110px}h1{font-size:27px}.book h1{font-size:31px}.book-grid{grid-template-columns:1fr;gap:25px}.book-grid .ingredients{columns:2;column-gap:18px}.book-grid .ingredients li{break-inside:avoid;font-size:12px}.book-grid .method li{font-size:14px}.flow-part{padding-left:21px;margin-left:4px}.outline .recipe-heading{padding:22px 19px}.outline h1{font-size:23px}.outline-rows{padding:3px 19px}.outline .plan-note{padding:12px 19px}.outline-footer{padding:14px 19px}.reader-body{padding:23px 20px}.reader-body h2{font-size:24px}.reader-top{padding:12px 18px}.plan-note{font-size:12px}}
</style></head><body><main>
<div class="sample-control"><label for="sample">Example</label><select id="sample"><option value="simple">Mushrooms & beans</option><option value="emp" disabled>Eleven Madison Park</option></select></div>
<p class="user" id="user"></p><p class="reply" id="reply"></p><div id="view"></div>
</main><nav class="switcher" aria-label="Compare prototypes" hidden><button id="prev" aria-label="Previous prototype">←</button><div class="switch-label"><small>Prototype comparison</small><strong id="variant-name"></strong></div><button id="next" aria-label="Next prototype">→</button></nav>
<dialog class="reader" id="reader"><div class="reader-top"><span id="reader-context"></span><button id="close-reader" aria-label="Close recipe panel">×</button></div><div class="reader-body" id="reader-body"></div></dialog>
<script>
const simple={id:'simple',title:'Miso mushrooms & butter beans',subtitle:'A comforting pan for a weeknight',book:'Original prototype recipe',authors:'Illustrative sample',serves:2,meta:'10 min prep · 20 min cook · Vegetarian',description:'Golden mushrooms and creamy beans, brightened with lemon.',provenance:'Original synthetic recipe. Prep tasks have been pulled out of the ingredient descriptions and arranged as a sample AI prep plan.',notice:'Original sample quantities for 2 servings. Timings are illustrative.',equipment:'Suggested equipment: wide frying pan, cutting board, knife, small bowl, grater and measuring spoons.',plan:[{title:'Before the pan goes on',text:'Tear the mushrooms, slice the garlic, drain the beans and prepare the finishing ingredients.',ids:['main']},{title:'Cook in one pan',text:'Brown the mushrooms, make the sauce and warm the beans. Add lemon and herbs at the end.',ids:['main']}],components:[{id:'main',title:'Mushrooms & butter beans',yield:'Serves 2',needed:'The complete dish',page:null,depends:[],ingredients:['300 g mixed mushrooms, torn','1 tbsp olive oil','2 garlic cloves, sliced','1 tbsp white miso','400 g canned butter beans, drained','150 ml water','1 tbsp butter','½ lemon, juice and zest','2 tbsp chopped parsley','2 slices sourdough toast, to serve'],prep:[{text:'Tear the mushrooms into pieces.',evidence:'300 g mixed mushrooms, torn.'},{text:'Slice the garlic; keep it separate from the mushrooms.',evidence:'2 garlic cloves, sliced. Garlic is added after the mushrooms brown.'},{text:'Drain the butter beans.',evidence:'400 g canned butter beans, drained.'},{text:'Zest and juice the lemon; chop the parsley. Keep both for finishing.',evidence:'½ lemon, juice and zest; 2 tbsp chopped parsley.'},{text:'Measure the miso and water into a small bowl, ready to mix.',evidence:'Mix the miso with the water in a small bowl.'}],steps:[{title:'Brown the mushrooms',body:'Heat the olive oil in a wide pan over medium-high heat. Add the mushrooms in a single layer. Leave until golden underneath, then turn and cook until browned.',uses:[0,1]},{title:'Make the sauce',body:'Lower the heat to medium. Add the sliced garlic and stir until fragrant. Mix the miso with the water, pour it into the pan, and scrape up the browned bits.',uses:[2,3,5]},{title:'Warm the beans',body:'Fold in the drained beans. Simmer gently until the sauce lightly coats them, stirring occasionally. Add a splash of water if it looks dry.',uses:[4]},{title:'Finish and serve',body:'Take the pan off the heat. Stir in butter, lemon zest and a squeeze of lemon juice. Taste, add more lemon if you like, and scatter over the parsley. Serve with toast.',uses:[6,7,8,9]}]}]};

const recipes={simple};const labels={A:'Open cookbook page',B:'Method first',C:'Compact outline'};const params=new URLSearchParams(location.search);const state={recipe:'simple',variant:labels[params.get('variant')]?params.get('variant'):'A',reading:null,compact:false};
const requested=params.get('recipe');const r=()=>recipes[state.recipe];const c=id=>r().components.find(x=>x.id===id);const main=()=>state.recipe==='simple'?r().components:['oven','duck','grains','sauce','plate'].map(c);const supporting=()=>r().components.filter(x=>!main().includes(x));
const esc=v=>String(v).replace(/[&<>"']/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
const norm=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
function ingredient(text,id){const dependency=r().components.find(x=>x.id!==id&&norm(text).includes(norm(x.title)));return dependency?`<a href="#${dependency.id}" data-component="${dependency.id}">${esc(text)}</a>`:esc(text)}
function ingredients(part){return '<ul class="ingredients">'+part.ingredients.map(s=>'<li>'+ingredient(s,part.id)+'</li>').join('')+'</ul>'}
function prep(part){return part.prep.length?`<div class="prep"><strong>Before you cook</strong><p>${part.prep.map(x=>esc(x.text)).join(' ')}</p></div>`:''}
function method(part){return '<ol class="method">'+part.steps.map(s=>`<li><strong>${esc(s.title)}</strong>${esc(s.body)}</li>`).join('')+'</ol>'}
function heading(){return `<header class="recipe-heading"><div class="eyebrow">${state.recipe==='emp'?'Eleven Madison Park':'Original sample recipe'}</div><h1>${esc(r().title)}</h1>${state.recipe==='emp'?`<p class="meta">${esc(r().subtitle)}</p>`:''}<p class="meta">Serves ${r().serves} · ${state.recipe==='emp'?'Begin the day before':'30 minutes'}</p><p class="byline">${state.recipe==='emp'?'Daniel Humm & Will Guidara · p. 191':'Illustrative recipe for this prototype'}</p></header>`}
function support(){return supporting().length?`<details class="support-block"><summary>Supporting recipes (${supporting().length})</summary><div class="support-links">${supporting().map(x=>`<a href="#${x.id}" data-component="${x.id}">${esc(x.title)}</a>`).join('')}</div></details>`:''}
function footnote(){return `<p class="footnote">${state.recipe==='emp'?'Prep organized from the book; method condensed.':'Sample timings and quantities.'} <button class="quiet" data-source="main">${state.recipe==='emp'?'Original source':'About this recipe'}</button></p>`}
function VariantA(){return `<article class="book">${heading()}${state.recipe==='emp'?'<p class="plan-note">Make the supporting recipes first. Lemon oil rests overnight; the carrot preparations use different oven temperatures.</p>':''}${main().map(part=>`<section class="book-section ${state.recipe==='simple'?'single':''}">${state.recipe==='emp'?`<h2>${esc(part.title)}</h2>`:''}<div class="book-grid"><aside><h3>Ingredients</h3>${state.recipe==='emp'?`<p class="yield">${esc(part.yield)} · ${esc(part.needed)} used here</p>`:''}${ingredients(part)}${prep(part)}</aside><div><h3>Method</h3>${method(part)}</div></div></section>`).join('')}${support()}${footnote()}</article>`}
function VariantB(){return `<article class="flow ${state.compact?'is-compact':''}">${heading()}<div class="flow-toolbar"><button class="flow-toggle" data-compact aria-expanded="${!state.compact}" aria-controls="flow-method">${state.compact?'Show full recipe ↓':'Compact recipe ↑'}</button></div><div class="flow-compact" id="flow-outline" ${state.compact?'':'hidden'}><ol>${(state.recipe==='emp'?main():main()[0].steps).map(x=>`<li>${esc(x.title)}</li>`).join('')}</ol>${state.recipe==='emp'?'<p class="plan-note">Plus 8 supporting recipes. Start the day before.</p>':''}</div><div id="flow-method" ${state.compact?'hidden':''}>${state.recipe==='emp'?'<p class="plan-note" style="margin-bottom:28px">Start with the supporting recipes, including overnight lemon oil. Ingredient links open those recipes when needed.</p>':''}${main().map(part=>`<section class="flow-part">${state.recipe==='emp'?`<h2>${esc(part.title)}</h2>`:''}${prep(part)}${!part.steps[0].uses?`<details class="whole-ingredients"><summary>Ingredients · ${esc(part.yield)}</summary>${ingredients(part)}</details>`:''}${part.steps.map((s,i)=>`<div class="flow-step"><h3>${i+1}. ${esc(s.title)}</h3><p>${esc(s.body)}</p>${s.uses?`<div class="at-hand"><b>For this step${state.recipe==='emp'?' · recipe quantities':''}</b>${s.uses.map(j=>ingredient(part.ingredients[j],part.id)).join(' · ')}</div>`:''}</div>`).join('')}</section>`).join('')}${support()}</div>${footnote()}</article>`}
function VariantC(){return `<article class="outline">${heading()}${state.recipe==='emp'?`<p class="plan-note">Two carrot preparations, grains, sauce, and plating.<br>Prepare the supporting recipes first; lemon oil rests overnight.</p><div class="outline-rows">${main().map(part=>`<button class="outline-row" data-component="${part.id}"><span><strong>${esc(part.title)}</strong><small>${esc(part.needed)}</small></span><span class="arrow">↗</span></button>`).join('')}</div><footer class="outline-footer"><button class="quiet" data-support>Supporting recipes (${supporting().length})</button><button class="quiet" data-source="main">Source</button></footer>`:`<div class="outline-brief"><p>${esc(r().description)}</p><button class="primary" data-component="main">Read recipe ↗</button></div>`}</article>`}
function log(){console.info('Recipe prototype view',JSON.stringify(state))}
function updateURL(){const u=new URL(location.href);u.searchParams.set('variant',state.variant);u.searchParams.set('recipe',state.recipe);history.replaceState(null,'',u)}
function render(){document.getElementById('sample').value=state.recipe;document.getElementById('user').textContent=state.recipe==='emp'?'Show me an ambitious recipe from Eleven Madison Park.':'Something comforting with mushrooms and beans for two?';document.getElementById('reply').textContent=state.recipe==='emp'?'This carrot dish is a weekend project.':'These mushrooms and beans would work well with toast.';document.getElementById('view').innerHTML=({A:VariantA,B:VariantB,C:VariantC}[state.variant])();document.getElementById('variant-name').textContent=state.variant+' — '+labels[state.variant];log()}
const reader=document.getElementById('reader');
function showReader(title,html,id){state.reading=id;document.getElementById('reader-context').textContent=title;document.getElementById('reader-body').innerHTML=html;if(!reader.open)reader.showModal();reader.scrollTop=0;log()}
function openComponent(id){const part=c(id);showReader(state.recipe==='emp'?'Eleven Madison Park':'Original sample recipe',`<h2>${esc(part.title)}</h2><p class="yield">${esc(part.yield)} · ${esc(part.needed)}</p><h3>Ingredients</h3>${ingredients(part)}${prep(part)}<h3>Method</h3>${method(part)}<button class="quiet" data-source="${id}">${state.recipe==='emp'?'Source p. '+part.page:'About this recipe'}</button>`,id)}
function openSource(id){if(state.recipe==='simple'){showReader('Sample recipe','<h2>About this recipe</h2><p>An original illustrative recipe made for this prototype, with fixed sample timings and quantities.</p>','source');return}let data=['main','oven','duck','grains','sauce','plate'].includes(id)?r().sources.main:r().sources[id];if(id==='pickles')data={...data,text:data.text+'\n'+r().sources.pickles_end.text};showReader(r().book,`<h2>${esc(c(id)?.title||r().title)}</h2><p class="yield">Source p. ${c(id)?.page||191}</p><div class="source-text">${esc(data.text.replace(/\s+/g,' '))}</div>`, 'source:'+id)}
function switchVariant(n){const ids=Object.keys(labels);state.variant=ids[(ids.indexOf(state.variant)+n+ids.length)%ids.length];if(reader.open)reader.close();updateURL();render()}
document.getElementById('prev').onclick=()=>switchVariant(-1);document.getElementById('next').onclick=()=>switchVariant(1);document.getElementById('close-reader').onclick=()=>reader.close();reader.onclose=()=>{state.reading=null;log()};document.getElementById('sample').onchange=e=>{state.recipe=e.target.value;updateURL();render()};
document.addEventListener('click',e=>{const toggle=e.target.closest('[data-compact]');if(!toggle)return;state.compact=!state.compact;document.querySelector('.flow').classList.toggle('is-compact',state.compact);document.getElementById('flow-method').hidden=state.compact;document.getElementById('flow-outline').hidden=!state.compact;toggle.setAttribute('aria-expanded',String(!state.compact));toggle.textContent=state.compact?'Show full recipe ↓':'Compact recipe ↑';log()});
document.addEventListener('click',e=>{const target=e.target.closest('[data-component],[data-source],[data-support]');if(!target)return;e.preventDefault();if(target.dataset.component)openComponent(target.dataset.component);else if(target.dataset.source)openSource(target.dataset.source);else showReader(r().book,`<h2>Supporting recipes</h2><div class="outline-rows">${supporting().map(x=>`<button class="outline-row" data-component="${x.id}"><span><strong>${esc(x.title)}</strong><small>${esc(x.yield)}</small></span><span class="arrow">↗</span></button>`).join('')}</div>`,'supporting')});
const switcher=document.querySelector('.switcher');switcher.hidden=!['localhost','127.0.0.1',''].includes(location.hostname);document.addEventListener('keydown',e=>{if(reader.open||switcher.hidden||e.target.closest('input,select,textarea,[contenteditable]'))return;if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();switchVariant(e.key==='ArrowLeft'?-1:1)}});
render();fetch('/emp.prototype.json').then(x=>{if(!x.ok)throw Error('missing');return x.json()}).then(x=>{const allocations={oven:[[0,1,2]],duck:[[0,1],[2,3,4,5,6]],grains:[[0,1,2,3,4,5,6],[7,8]],sauce:[[0],[1,2,3,4,5]],plate:[[0,1],[2,3,4],[5,6,7,8]]};for(const part of x.components)if(allocations[part.id])part.steps.forEach((step,i)=>step.uses=allocations[part.id][i]);recipes.emp=x;document.querySelector('#sample option[value="emp"]').disabled=false;if(requested==='emp'){state.recipe='emp';render()}}).catch(()=>{document.querySelector('#sample option[value="emp"]').textContent='EMP sample unavailable'});
</script></body></html>
