<!doctype html>
<!-- Throwaway v4: one recipe disclosure; component content opens in place.
Fixed sample content, no saved state or cooking workflow. -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Recipe preview</title>
<style>
:root{font:15px/1.65 system-ui,-apple-system,sans-serif;color:#292d28;background:#fff;--muted:#767c71;--line:#e4e7df;--green:#36563e}*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0}button,select{font:inherit}button,summary{cursor:pointer}button:focus-visible,summary:focus-visible,a:focus-visible,select:focus-visible{outline:2px solid #49754d;outline-offset:4px}button{color:inherit}main{max-width:740px;padding:28px 24px 70px;margin:auto}.examples{display:flex;align-items:center;gap:10px;font-size:11px;color:var(--muted);margin-bottom:32px}.examples select{font-size:11px;padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:white;color:#515b49}.user{max-width:350px;margin:0 0 30px auto;background:#f2f3ef;padding:12px 17px;border-radius:17px 17px 4px 17px;font-size:14px}.reply{margin:0 0 19px;font-size:14px}.card{border:1px solid var(--line);border-radius:13px;overflow:hidden}.heading{padding:25px 27px 19px}h1{font-size:25px;line-height:1.25;letter-spacing:-.035em;font-weight:610;margin:0 0 8px}.subtitle{font-size:14px;color:#606a56;margin:0 0 11px}.byline{font-size:12px;color:var(--muted);margin:0 0 14px}.meta{font-size:12px;margin:0;color:#5a6550}.document>summary{list-style:none;padding:13px 27px;color:var(--green);border-top:1px solid var(--line);font-size:13px;font-weight:580;display:flex;justify-content:space-between;align-items:center}.document>summary::-webkit-details-marker,.component>summary::-webkit-details-marker{display:none}.document>summary:after{content:'↓';font-size:17px;font-weight:400}.document[open]>summary:after{content:'↑'}.document[open]>summary{border-bottom:1px solid var(--line)}.close-label{display:none}.document[open] .open-label{display:none}.document[open] .close-label{display:inline}.reading{padding:22px 27px 24px}.reading h2{font-size:15px;font-weight:650;margin:26px 0 10px}.reading h2:first-child{margin-top:0}.ingredients{list-style:none;padding:0;margin:0}.ingredients li{padding:5px 0;font-size:14px}.prep{background:#f6f7f2;padding:15px 17px;border-radius:7px;margin:25px 0}.prep h2{margin:0 0 7px}.prep ul{padding-left:17px;margin:0;font-size:13px}.prep li{padding:3px 0}.method{margin:0;padding-left:20px}.method li{padding-left:8px;margin-bottom:19px;font-size:14px;line-height:1.8}.method li::marker{font-weight:600;color:#627657}.method strong{display:block;font-weight:600;margin-bottom:3px}.ahead{font-size:13px;color:#646f5a;margin:0 0 19px;padding:0 0 18px;border-bottom:1px solid var(--line)}.ahead strong{color:#343e2d;font-weight:600}.component{border-bottom:1px solid var(--line)}.component>summary{padding:14px 0;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:15px;font-size:14px;font-weight:550}.component>summary:after{content:'+';color:#9aa38f;font-weight:400;font-size:19px}.component[open]>summary:after{content:'−'}.component-body{padding:2px 0 22px}.yield{font-size:11px;color:var(--muted);margin:0 0 18px}.supporting{margin-top:22px;font-size:13px;color:#59664f}.supporting>summary{padding:9px 0}.supporting .component{color:#292d28}.supporting .component>summary{font-size:13px}.footnote{font-size:11px;color:var(--muted);margin:24px 0 0}.source-link{border:0;background:transparent;font-size:11px;color:#6d7863;padding:0;text-decoration:underline;text-underline-offset:3px}.component-body>.source-link{margin-top:6px}a{color:var(--green);text-decoration:underline;text-decoration-color:#a7b99b;text-underline-offset:3px}.source-dialog{width:min(720px,calc(100% - 24px));max-height:85vh;border:1px solid var(--line);border-radius:12px;padding:0;color:inherit}.source-dialog::backdrop{background:#14241955}.dialog-header{padding:17px 22px;display:flex;justify-content:space-between;gap:15px;align-items:center;border-bottom:1px solid var(--line);background:white;position:sticky;top:0}.dialog-header h2{margin:0;font-size:16px}.dialog-header button{border:0;background:transparent;font-size:25px;cursor:pointer}.dialog-body{padding:21px;font-size:13px}.source-text{white-space:pre-wrap;line-height:1.85}.dialog-body details{font-size:10px;margin-top:20px}.dialog-body pre{white-space:pre-wrap;overflow-wrap:anywhere}
@media(max-width:480px){main{padding:20px 14px 45px}.examples{margin-bottom:24px}.heading{padding:22px 20px 18px}h1{font-size:23px}.document>summary{padding:13px 20px}.reading{padding:20px}.user{font-size:13px}.method li{font-size:14px}.reply{font-size:13px}}
</style></head><body><main>
<div class="examples"><label for="example">Preview recipe</label><select id="example"><option value="simple">Mushrooms & beans</option><option value="emp" disabled>Eleven Madison Park</option></select></div>
<p class="user" id="user"></p><p class="reply" id="reply"></p><div id="view"></div>
</main><dialog class="source-dialog" id="source-dialog"><div class="dialog-header"><h2 id="source-title"></h2><button id="close-source" aria-label="Close source">×</button></div><div class="dialog-body" id="source-body"></div></dialog>
<script>
const simple={id:'simple',title:'Miso mushrooms & butter beans',subtitle:'A comforting pan for a weeknight',book:'Original prototype recipe',authors:'Illustrative sample',serves:2,meta:'10 min prep · 20 min cook · Vegetarian',description:'Golden mushrooms and creamy beans, brightened with lemon.',provenance:'Original synthetic recipe. Prep tasks have been pulled out of the ingredient descriptions and arranged as a sample AI prep plan.',notice:'Original sample quantities for 2 servings. Timings are illustrative.',equipment:'Suggested equipment: wide frying pan, cutting board, knife, small bowl, grater and measuring spoons.',plan:[{title:'Before the pan goes on',text:'Tear the mushrooms, slice the garlic, drain the beans and prepare the finishing ingredients.',ids:['main']},{title:'Cook in one pan',text:'Brown the mushrooms, make the sauce and warm the beans. Add lemon and herbs at the end.',ids:['main']}],components:[{id:'main',title:'Mushrooms & butter beans',yield:'Serves 2',needed:'The complete dish',page:null,depends:[],ingredients:['300 g mixed mushrooms, torn','1 tbsp olive oil','2 garlic cloves, sliced','1 tbsp white miso','400 g canned butter beans, drained','150 ml water','1 tbsp butter','½ lemon, juice and zest','2 tbsp chopped parsley','2 slices sourdough toast, to serve'],prep:[{text:'Tear the mushrooms into pieces.',evidence:'300 g mixed mushrooms, torn.'},{text:'Slice the garlic; keep it separate from the mushrooms.',evidence:'2 garlic cloves, sliced. Garlic is added after the mushrooms brown.'},{text:'Drain the butter beans.',evidence:'400 g canned butter beans, drained.'},{text:'Zest and juice the lemon; chop the parsley. Keep both for finishing.',evidence:'½ lemon, juice and zest; 2 tbsp chopped parsley.'},{text:'Measure the miso and water into a small bowl, ready to mix.',evidence:'Mix the miso with the water in a small bowl.'}],steps:[{title:'Brown the mushrooms',body:'Heat the olive oil in a wide pan over medium-high heat. Add the mushrooms in a single layer. Leave until golden underneath, then turn and cook until browned.',uses:[0,1]},{title:'Make the sauce',body:'Lower the heat to medium. Add the sliced garlic and stir until fragrant. Mix the miso with the water, pour it into the pan, and scrape up the browned bits.',uses:[2,3,5]},{title:'Warm the beans',body:'Fold in the drained beans. Simmer gently until the sauce lightly coats them, stirring occasionally. Add a splash of water if it looks dry.',uses:[4]},{title:'Finish and serve',body:'Take the pan off the heat. Stir in butter, lemon zest and a squeeze of lemon juice. Taste, add more lemon if you like, and scatter over the parsley. Serve with toast.',uses:[6,7,8,9]}]}]};

const recipes={simple};let current='simple';const requested=new URLSearchParams(location.search).get('recipe');
const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const recipe=()=>recipes[current];const component=id=>recipe().components.find(c=>c.id===id);
const normalized=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
function ingredientList(c){return '<ul class="ingredients">'+c.ingredients.map(text=>{const dependency=recipe().components.find(x=>x.id!==c.id&&normalized(text).includes(normalized(x.title)));return '<li>'+(dependency?`<a href="#component-${dependency.id}" data-jump="${dependency.id}">${esc(text)}</a>`:esc(text))+'</li>'}).join('')+'</ul>'}
function prepText(c,i){if(current==='emp')return c.prep[i].text;return ['Tear 300 g mushrooms into pieces.','Slice 2 garlic cloves; keep separate from the mushrooms.','Drain the 400 g can of butter beans.','Zest and juice ½ lemon. Chop parsley to make 2 tbsp.','Measure 1 tbsp miso and 150 ml water into a small bowl.'][i]}
function method(c){return '<ol class="method">'+c.steps.map(s=>`<li><strong>${esc(s.title)}</strong>${esc(s.body)}</li>`).join('')+'</ol>'}
function content(c){return `<h2>Ingredients</h2>${ingredientList(c)}${c.prep.length?`<section class="prep"><h2>Before you cook</h2><ul>${c.prep.map((_,i)=>`<li>${esc(prepText(c,i))}</li>`).join('')}</ul></section>`:''}<h2>Method</h2>${method(c)}`}
function section(c){return `<details class="component" id="component-${c.id}"><summary>${esc(c.title)}</summary><div class="component-body"><p class="yield">${esc(c.yield)} · Used here: ${esc(c.needed)}</p>${content(c)}<button class="source-link" data-source="${c.id}">Source p. ${c.page}</button></div></details>`}
function body(){const r=recipe();if(current==='simple')return content(r.components[0]);const main=['oven','duck','grains','sauce','plate'];return `<p class="ahead"><strong>Start a day ahead.</strong> Make the supporting recipes first—the lemon oil rests overnight.</p>${main.map(id=>section(component(id))).join('')}<details class="supporting" id="supporting"><summary>Supporting recipes · oils, stock, purées & garnishes</summary>${r.components.filter(c=>!main.includes(c.id)).map(section).join('')}</details>`}
function render(){const r=recipe();document.getElementById('example').value=current;document.getElementById('user').textContent=current==='emp'?'Show me an ambitious recipe from Eleven Madison Park.':'Something comforting with mushrooms and beans for two?';document.getElementById('reply').textContent=current==='emp'?'This carrot dish is a project for a weekend.':'These mushrooms and beans would work well with toast.';document.getElementById('view').innerHTML=`<article class="card"><div class="heading"><h1>${esc(r.title)}</h1>${current==='emp'?`<p class="subtitle">${esc(r.subtitle)}</p>`:''}<p class="byline">${current==='emp'?'Eleven Madison Park · Daniel Humm & Will Guidara':'Original sample recipe'}</p><p class="meta">Serves ${r.serves} · ${current==='emp'?'Begin the day before':'30 minutes'}</p></div><details class="document" id="recipe-content"><summary><span class="open-label">View recipe</span><span class="close-label">Hide recipe</span></summary><div class="reading">${body()}<p class="footnote">${current==='emp'?'Prep organized from the recipe; method condensed.':'Illustrative recipe with sample timings.'} <button class="source-link" data-source="main">${current==='emp'?'Read original source':'About this sample'}</button></p></div></details></article>`}
function openSource(id){const r=recipe(),c=component(id);let data;if(current==='emp'){data=['main','oven','duck','grains','sauce','plate'].includes(id)?r.sources.main:r.sources[id];if(id==='pickles')data={...data,text:data.text+'\n'+r.sources.pickles_end.text}}document.getElementById('source-title').textContent=(c?.title||r.title)+(data?' · Source':'');document.getElementById('source-body').innerHTML=data?`<p>${esc(r.book)} · ${esc(r.authors)} · p. ${c?.page||191}</p><div class="source-text">${esc(data.text.replace(/\s+/g,' '))}</div><details><summary>Source identifiers</summary><pre>${esc(JSON.stringify(data.citation,null,2))}</pre></details>`:'<p>This is an original illustrative recipe made for this prototype. The prep instructions unpack the ingredient descriptions. No cookbook text was used for this sample.</p>';document.getElementById('source-dialog').showModal()}
document.getElementById('close-source').onclick=()=>document.getElementById('source-dialog').close();
document.getElementById('example').onchange=e=>{current=e.target.value;const url=new URL(location.href);url.searchParams.set('recipe',current);url.searchParams.delete('panel');url.searchParams.delete('variant');history.replaceState(null,'',url);render()};
document.addEventListener('click',e=>{const source=e.target.closest('[data-source]');if(source)openSource(source.dataset.source);const link=e.target.closest('[data-jump]');if(link){e.preventDefault();const target=document.getElementById('component-'+link.dataset.jump);for(let p=target;p;p=p.parentElement)if(p.tagName==='DETAILS')p.open=true;target.scrollIntoView({block:'start'});target.querySelector('summary').focus({preventScroll:true})}});
render();fetch('/emp.prototype.json').then(r=>{if(!r.ok)throw Error('missing');return r.json()}).then(r=>{recipes.emp=r;document.querySelector('#example option[value="emp"]').disabled=false;if(requested==='emp'){current='emp';render()}}).catch(()=>{document.querySelector('#example option[value="emp"]').textContent='EMP sample unavailable'});
</script></body></html>
