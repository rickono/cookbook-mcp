[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[project]
name = "cookbook-mcp"
version = "0.1.0"
description = "Private, versioned cookbook library: local proof of concept"
requires-python = ">=3.12"
dependencies = [
  "mcp==2.2.0",
  "pypdf==6.18.1",
  "pillow==12.3.0",
  "lxml==6.1.3",
  "PyJWT[crypto]==2.14.0",
  "boto3==1.43.93",
  "uvicorn==0.52.4",
  "httpx==0.28.1",
  "fonttools==4.65.0",
  "numpy==2.5.3",
]
[dependency-groups]
dev = [
    "pytest==9.1.1",
    "moto[server]==5.2.3",
    "reportlab==5.0.1",
    "ruff==0.16.7",
]
[project.scripts]
cookbook = "cookbook.cli:main"
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
[tool.hatch.build.targets.wheel]
packages = ["src/cookbook"]
